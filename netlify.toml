[build]
  publish = "."

# Do not publish local-only ops files or unused heavy assets.
# force=true so these win over files that still exist in the publish directory.
[[redirects]]
  from = "/server.py"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/google_apps_script.js"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/tailwind.config.js"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/design-system.html"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/design-system"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/assets/hero-adjuster-truck.jpg"
  to = "/index.html"
  status = 404
  force = true

# Protect internal company OS documents from public web browsing
[[redirects]]
  from = "/company_os/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/compare"
  to = "/pricing.html"
  status = 301

[[redirects]]
  from = "/compare.html"
  to = "/pricing.html"
  status = 301

[[redirects]]
  from = "/security"
  to = "/security.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/request"
  to = "/request.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
